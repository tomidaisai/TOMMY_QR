<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TOMMY QR</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace" aria-label="QRコード生成">
        <div class="panel controls-panel">
          <p class="eyebrow">TOMMY QR</p>

          <div class="mode-tabs" role="tablist" aria-label="QRコードの種類">
            <button id="urlModeButton" type="button" class="mode-button active" aria-pressed="true">URLそのまま</button>
            <button id="textModeButton" type="button" class="mode-button" aria-pressed="false">文字列埋め込み</button>
          </div>

          <div id="urlFields">
            <label class="field">
            <span>URL</span>
            <input id="urlInput" type="url" value="https://example.com" placeholder="https://example.com" autocomplete="url">
            </label>
          </div>

          <div id="textFields" class="hidden">
            <label class="field">
              <span>埋め込む文字列</span>
              <textarea id="textInput" rows="6" placeholder="QRコードに埋め込む文字列" autocomplete="off"></textarea>
            </label>
          </div>

          <label class="field">
            <span>中央画像</span>
            <select id="artPatternInput">
              <option value="pattern1">パターン1</option>
              <option value="pattern2">パターン2</option>
              <option value="pattern3" disabled>パターン3（画像未登録）</option>
              <option value="pattern4" disabled>パターン4（画像未登録）</option>
            </select>
          </label>

          <div class="actions">
            <button id="downloadButton" type="button">PNG保存</button>
          </div>
        </div>

        <div class="preview-wrap">
          <canvas id="qrCanvas" width="1080" height="1080" aria-label="生成されたQRコード"></canvas>
          <p id="statusText" role="status">URLを入力すると自動で更新されます。</p>
        </div>
      </section>
    </main>

    <div id="qrSource" hidden></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
